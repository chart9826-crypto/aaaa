<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Motorbike Experience</title>
  <!-- AR.js & A-Frame Libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    /* UI Container */
    #ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 400px;
    }

    /* Status & Speed Display */
    .status-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .speed-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
    }

    /* Control Panel */
    .control-panel {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      box-sizing: border-box;
      justify-content: space-between;
    }

    /* Buttons */
    .btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .btn-speed {
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }

    .btn-speed.active {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.5);
    }

    .btn-off {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* Instruction Overlay */
    #instruction {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="instruction">📷 ส่องกล้องไปที่ Marker "Hiro"</div>

  <!-- UI Controls -->
  <div id="ui-container">
    <div class="status-card">
      <div id="status-display" class="speed-text">สถานะ: ดับเครื่องยนต์</div>
    </div>
    
    <div class="control-panel">
      <button class="btn btn-start" onclick="setEngine(true)">สตาร์ท</button>
      <button class="btn btn-speed" onclick="setSpeed(1)">เกียร์ 1</button>
      <button class="btn btn-speed" onclick="setSpeed(2)">เกียร์ 2</button>
      <button class="btn btn-speed" onclick="setSpeed(3)">เกียร์ 3</button>
      <button class="btn btn-speed" onclick="setSpeed(4)">เกียร์ 4</button>
      <button class="btn btn-off" onclick="setEngine(false)">ดับเครื่อง</button>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <!-- Ambient & Directional Lights -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <!-- Hiro Marker -->
    <a-marker preset="hiro">
      <!-- Motorbike Main Group (Side View: Rotated 90 degrees around Y-axis) -->
      <a-entity id="motorbike" position="0 0.2 0" rotation="0 90 0" scale="0.8 0.8 0.8">
        
        <!-- Main Body & Frame -->
        <a-box position="0 0.3 0" width="1.6" height="0.35" depth="0.4" color="#dc2626" material="metalness: 0.6; roughness: 0.2"></a-box> <!-- Red Body -->
        <a-box position="-0.1 0.48 0" width="0.7" height="0.12" depth="0.38" color="#1e293b"></a-box> <!-- Black Seat -->
        <a-box position="0.5 0.5 0" width="0.4" height="0.25" depth="0.35" color="#94a3b8" material="metalness: 0.8; roughness: 0.2"></a-box> <!-- Fuel Tank -->
        <a-cylinder position="0.1 0.1 0" radius="0.2" height="0.4" rotation="0 0 90" color="#334155" material="metalness: 0.9"></a-cylinder> <!-- Engine Core -->
        <a-cylinder position="-0.3 0.05 0.18" radius="0.04" height="0.9" rotation="0 0 80" color="#cbd5e1" material="metalness: 0.95"></a-cylinder> <!-- Exhaust Pipe -->

        <!-- Handlebar & Headlight -->
        <a-cylinder position="0.65 0.6 0" radius="0.025" height="0.6" rotation="90 0 0" color="#0f172a"></a-cylinder>
        <a-sphere position="0.85 0.55 0" radius="0.12" color="#fef08a" material="emissive: #fef08a; emissiveIntensity: 0.5"></a-sphere> <!-- Headlight -->

        <!-- Front & Rear Suspensions/Forks -->
        <a-cylinder position="0.75 0.15 0" radius="0.03" height="0.7" rotation="0 0 -20" color="#64748b"></a-cylinder>
        <a-cylinder position="-0.65 0.15 0" radius="0.03" height="0.6" rotation="0 0 20" color="#64748b"></a-cylinder>

        <!-- FRONT WHEEL ASSEMBLY -->
        <a-entity id="front-wheel-group" position="0.85 0 0">
          <!-- Outer Tire -->
          <a-torus radius="0.28" tube="0.06" color="#0f172a" material="roughness: 0.9"></a-torus>
          <!-- Inner Rim/Spokes Container (This will rotate) -->
          <a-entity id="front-wheel-spokes">
            <a-cylinder radius="0.12" height="0.08" color="#94a3b8" rotation="90 0 0" material="metalness: 0.8"></a-cylinder>
            <!-- Spokes Visual Patterns -->
            <a-box width="0.52" height="0.02" depth="0.02" color="#f8fafc"></a-box>
            <a-box width="0.02" height="0.52" depth="0.02" color="#f8fafc"></a-box>
            <a-box width="0.38" height="0.02" depth="0.02" rotation="0 0 45" color="#f8fafc"></a-box>
            <a-box width="0.38" height="0.02" depth="0.02" rotation="0 0 -45" color="#f8fafc"></a-box>
          </a-entity>
        </a-entity>

        <!-- REAR WHEEL ASSEMBLY -->
        <a-entity id="rear-wheel-group" position="-0.75 0 0">
          <!-- Outer Tire -->
          <a-torus radius="0.28" tube="0.06" color="#0f172a" material="roughness: 0.9"></a-torus>
          <!-- Inner Rim/Spokes Container (This will rotate) -->
          <a-entity id="rear-wheel-spokes">
            <a-cylinder radius="0.12" height="0.08" color="#94a3b8" rotation="90 0 0" material="metalness: 0.8"></a-cylinder>
            <!-- Spokes Visual Patterns -->
            <a-box width="0.52" height="0.02" depth="0.02" color="#f8fafc"></a-box>
            <a-box width="0.02" height="0.52" depth="0.02" color="#f8fafc"></a-box>
            <a-box width="0.38" height="0.02" depth="0.02" rotation="0 0 45" color="#f8fafc"></a-box>
            <a-box width="0.38" height="0.02" depth="0.02" rotation="0 0 -45" color="#f8fafc"></a-box>
          </a-entity>
        </a-entity>

      </a-entity>
    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // System State Variables
    let isEngineRunning = false;
    let currentSpeedLevel = 1; // Default to Level 1
    let frontWheel, rearWheel;
    let animationFrameId = null;
    let currentRotation = 0;

    // Speed mappings (Rotation step in degrees per frame)
    const speedTable = {
      1: 4,   // Level 1: Low speed
      2: 9,   // Level 2: Medium speed
      3: 16,  // Level 3: High speed
      4: 28   // Level 4: Ultra high speed
    };

    // Initialize References on DOM Loaded
    document.addEventListener('DOMContentLoaded', () => {
      frontWheel = document.getElementById('front-wheel-spokes');
      rearWheel = document.getElementById('rear-wheel-spokes');
    });

    // Start / Stop Engine
    function setEngine(start) {
      isEngineRunning = start;
      const statusDisplay = document.getElementById('status-display');

      if (isEngineRunning) {
        statusDisplay.innerText = `สถานะ: สตาร์ทเครื่องยนต์ (ระดับ ${currentSpeedLevel})`;
        statusDisplay.style.color = '#4ade80';
        if (!animationFrameId) {
          animateWheels();
        }
      } else {
        statusDisplay.innerText = "สถานะ: ดับเครื่องยนต์";
        statusDisplay.style.color = '#ef4444';
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }
      updateButtonStyles();
    }

    // Set Speed Level (1-4)
    function setSpeed(level) {
      currentSpeedLevel = level;
      
      // Auto-start engine if user selects speed level while stopped
      if (!isEngineRunning) {
        setEngine(true);
      } else {
        const statusDisplay = document.getElementById('status-display');
        statusDisplay.innerText = `สถานะ: สตาร์ทเครื่องยนต์ (ระดับ ${currentSpeedLevel})`;
        updateButtonStyles();
      }
    }

    // Update Wheel Rotations Frame by Frame
    function animateWheels() {
      if (!isEngineRunning) return;

      const step = speedTable[currentSpeedLevel] || 4;
      // Reverse direction so it spins forward visually for side-view
      currentRotation = (currentRotation - step) % 360;

      if (frontWheel && rearWheel) {
        // Rotate around Z axis (Wheel axle plane)
        frontWheel.setAttribute('rotation', `0 0 ${currentRotation}`);
        rearWheel.setAttribute('rotation', `0 0 ${currentRotation}`);
      }

      animationFrameId = requestAnimationFrame(animateWheels);
    }

    // Highlight Active Buttons UI
    function updateButtonStyles() {
      const buttons = document.querySelectorAll('.btn-speed');
      buttons.forEach((btn, idx) => {
        if (isEngineRunning && (idx + 1) === currentSpeedLevel) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
